[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qmt-quant-demo"
version = "0.1.0"
description = "基于 QMT 的事件驱动量化交易 Demo 平台"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Codex" }]
dependencies = [
  "akshare>=1.17",
  "baostock>=0.8.9",
  "holidays>=0.96",
  "pandas>=2.0",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
  "psycopg[binary]>=3.3",
]

[project.optional-dependencies]
ui = ["streamlit>=1.0"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --basetemp=data/pytest_tmp"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
# 收尾文档 §52：CI 强制 Ruff 失败；规则集显式锁定核心错误，避免默认规则集升级漂移。
select = ["E4", "E7", "E9", "F"]
