# backtest.v1 Contract（设计文档 §18 / §19 / §43 / §44）
# Producer: quant   Consumers: stock_agent
contract_version: backtest.v1
service: quant
endpoints:
  - name: create_backtest
    method: POST
    path: /api/v1/backtests
    idempotency: Idempotency-Key header（§33）
    request:
      strategy:
        type: { type: string, enum: [target_portfolio, equal_weight] }
        version: { type: string }
        rebalance_targets: { type: array, required: false }
        rebalance_every_days: { type: integer, required: false }
      market_snapshot_id: { type: string, required: false }
      symbols: { type: array, required: false, description: "与 market_snapshot_id 二选一" }
      start: { type: date, required: true }
      end: { type: date, required: true }
      initial_cash: { type: number, default: 1000000 }
      benchmark: { type: string, required: false }
      execution_config:
        execution_model: { type: string, enum: [next_open, close, vwap, limit_price], default: next_open }
        commission_rate: { type: number, default: 0.0003 }
        min_commission: { type: number, default: 5 }
        stamp_duty_rate: { type: number, default: 0.001 }
        slippage: { type: number, default: 0.001 }
        t1: { type: boolean, default: true }
        price_limit: { type: boolean, default: true }
        suspension: { type: boolean, default: true }
    response:
      status_code: 202
      data:
        backtest_id: string
        status: { enum: [QUEUED, RUNNING, COMPLETED, FAILED] }
        config_hash: { type: string, description: "§44 Reproducibility Hash" }
        reused: { type: boolean, required: false }
  - name: get_backtest
    method: GET
    path: /api/v1/backtests/{backtest_id}
  - name: result_sections
    method: GET
    paths:
      - /api/v1/backtests/{backtest_id}/metrics
      - /api/v1/backtests/{backtest_id}/equity
      - /api/v1/backtests/{backtest_id}/trades
      - /api/v1/backtests/{backtest_id}/positions
      - /api/v1/backtests/{backtest_id}/daily-actions
      - /api/v1/backtests/{backtest_id}/diagnostics
  - name: get_backtest_lineage
    method: GET
    path: /api/v1/backtests/{backtest_id}/lineage
    description: "详细修改方案 §20：回测血缘（spec hash/快照身份/执行与成本模型版本/代码版本）"
  - name: replay_backtest
    method: POST
    path: /api/v1/backtests/{backtest_id}/replay
    description: "详细修改方案 §3.4：确定性重放，比对结果内容哈希"
job_schema:
  # §43 backtest_jobs
  fields: [backtest_id, status, strategy_id, strategy_version, market_snapshot_id, config_hash,
           start_date, end_date, initial_cash, benchmark, created_at, started_at, completed_at,
           error_code, error_message]
metrics:
  # §19 标准指标
  - total_return
  - annualized_return
  - benchmark_return
  - excess_return
  - max_drawdown
  - sharpe
  - sortino
  - calmar
  - volatility
  - win_rate
  - turnover
  - trading_cost
  - average_holding_period
  - exposure
  - cash_ratio
quality_flags:
  - VWAP_APPROXIMATED
  - PRICE_LIMIT_METADATA_MISSING
  - PIT_SECURITY_STATUS_MISSING
  - LOOKAHEAD_CHECK_BYPASSED
  - SURVIVORSHIP_RISK
backtest_spec_hash:
  # 详细修改方案 §12：BacktestRequest 内容寻址身份，写入结果 diagnostics
  fields:
    - strategy_id
    - strategy_version
    - strategy_config_hash
    - market_snapshot_id
    - execution_model_version   # 当前 execution-model.v1
    - transaction_cost_version  # 当前 transaction-cost.v1
    - initial_cash
    - benchmark
    - code_sha
rules:
  - Backtest 必须异步执行，创建立即返回 QUEUED
  - 相同 config_hash 的已完成回测必须复用（§44）
  - 出现严重 quality_flags 时，Agent 不得把结果描述为"严格历史回测"（§19）
  - T+1 / 停牌 / 涨跌停 / 统一成本模型必须生效（§51/§52/§53）
  - available_at 晚于调仓决策时间立即 LOOKAHEAD_VIOLATION（§48）
error_codes: [BACKTEST_FAILED, LOOKAHEAD_VIOLATION, SNAPSHOT_NOT_FOUND, DATA_NOT_READY]
