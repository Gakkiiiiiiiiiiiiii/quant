name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly full：full golden + large replay regression（详细修改方案 §26）
    - cron: "30 17 * * *"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff
        # 收尾文档 §52：Ruff 必须强制失败，禁止 || true
        run: |
          pip install ruff
          ruff check src tests

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,test]"
          pip install pytest-cov
      - name: Pytest (coverage)
        run: pytest -q --cov=quant_demo --cov-report=term-missing

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,test]"
      - name: Contract governance checksum
        # 详细修改方案 §21：Quant 为三项契约唯一 Producer，checksum 防漂移
        run: python scripts/contract_checksums.py --verify
      - name: Provider contract tests
        run: pytest -q tests/test_market_data_contract.py tests/test_backtest_api.py tests/test_paper_api.py tests/test_backtest_identity_api.py

  snapshot-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,test]"
      - name: Snapshot immutability / manifest / corruption / no-live-reload
        # 详细修改方案 §3：不可变快照全套回归
        run: >
          pytest -q tests/test_snapshot_immutability.py tests/test_snapshot_manifest.py
          tests/test_snapshot_corruption.py tests/test_backtest_snapshot_replay.py
          tests/test_backtest_no_live_reload.py

  golden-backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,test]"
      - name: Golden market snapshot + OMS guardrails
        # PR 运行 small golden；Nightly 运行 full golden + replay regression（§26）
        run: >
          pytest -q tests/test_golden_market_snapshot.py tests/test_oms_guardrails.py
          tests/test_data_quality_flags.py
        env:
          QUANT_GOLDEN_MODE: ${{ github.event_name == 'schedule' && 'full' || 'small' }}

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
